# OpenWA + .NET Enterprise Agent - Docker Compose
# Run with: docker compose -f docker-compose.agent-dotnet.yml up -d --build

services:
  # OpenWA WhatsApp API Gateway
  openwa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openwa-api
    restart: unless-stopped
    ports:
      - "2785:2785"
    environment:
      - NODE_ENV=development
      - AUTO_START_SESSIONS=true
      - DATABASE_TYPE=sqlite
      - ENGINE_TYPE=baileys
      - MCP_ENABLED=true
      - MCP_READONLY=false
      - WEBHOOK_SSRF_PROTECT=false
      - SSRF_ALLOWED_HOSTS=dotnet-agent,host.docker.internal
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # .NET Enterprise Agent
  dotnet-agent:
    build:
      context: ./agent-dotnet
      dockerfile: Dockerfile
    container_name: dotnet-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - Agent__McpServers__0__Name=OpenWA
      - Agent__McpServers__0__Endpoint=http://openwa-api:2785
      - Agent__ApiKey=${NVIDIA_API_KEY:-your_nvidia_api_key_here}
      - Agent__ModelId=meta/llama-3.2-11b-vision-instruct
    volumes:
      - ./data:/app/data:ro
      - ./agent-dotnet/rules.json:/app/rules.json:ro
    depends_on:
      - openwa
